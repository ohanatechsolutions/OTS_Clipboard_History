name: Import supplied original logo

on:
  push:
    paths:
      - '.github/workflows/import-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve full-resolution PNG and verify original upload hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/branding
          curl --fail --silent --show-error --location --retry 2 \
            --output assets/branding/OTS_Clipboard_History_Logo.png \
            'https://94ae06e3-7b06-4c28-bd10-89d7166ca3dc.sandbox.floot.app/_cdn/static/e2a7ca68-c4e5-49fc-87cb-7bd4c5123373-OTSClipboardHistoryLogoTemp.png'
          test "$(wc -c < assets/branding/OTS_Clipboard_History_Logo.png)" -eq 805043
          echo 'de4c5a343a562497fe940acb78f5b9863eeddf9ba55e1404540459333ebd5bb7  assets/branding/OTS_Clipboard_History_Logo.png' | sha256sum --check
      - name: Save unchanged PNG to the repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/OTS_Clipboard_History_Logo.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: import original 1024px transparent PNG logo [skip ci]"
            git push origin HEAD:main
          fi
